<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Learning Knight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Gloock&display=swap">
<style>
/* Layout: one calm reading column (max 640px); the word itself is the hero of every screen, set like a dictionary entry. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E9ECE6; --ink:#1B2230; --muted:#596273; --line:#D8DDD4;
  --accent:#2C4A9A; --accent-ink:#FFFFFF; --accent-soft:#E2E8F6;
  --brass:#9A6A1C; --brass-soft:#F3E7D1;
  --good:#2C7448; --good-soft:#DFF0E5; --bad:#B03A2B; --bad-soft:#F7E1DC;
  --lvl0:#BCC3B8; --lvl1:#7C93C9; --lvl2:#2C4A9A; --lvl3:#9A6A1C;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,30,50,.06), 0 4px 16px rgba(20,30,50,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151C; --surface:#1A202A; --sunk:#151A22; --ink:#E8EBF0; --muted:#9AA3B2; --line:#2C3441;
  --accent:#8EA8F2; --accent-ink:#0E1424; --accent-soft:#1F2A45;
  --brass:#D8A85B; --brass-soft:#3A2F1D;
  --good:#72C995; --good-soft:#163225; --bad:#F08B7C; --bad-soft:#3B201C;
  --lvl0:#4A5260; --lvl1:#5D74AE; --lvl2:#8EA8F2; --lvl3:#D8A85B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1A202A; --sunk:#151A22; --ink:#E8EBF0; --muted:#9AA3B2; --line:#2C3441;
  --accent:#8EA8F2; --accent-ink:#0E1424; --accent-soft:#1F2A45;
  --brass:#D8A85B; --brass-soft:#3A2F1D;
  --good:#72C995; --good-soft:#163225; --bad:#F08B7C; --bad-soft:#3B201C;
  --lvl0:#4A5260; --lvl1:#5D74AE; --lvl2:#8EA8F2; --lvl3:#D8A85B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 64px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700;min-height:44px}
@media (hover:hover){.btn:hover{border-color:var(--accent)}}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:10px}
.btn.wide{width:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px 16px}
.brand{font-family:var(--display);font-size:1.25rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.topbar .row{flex-wrap:nowrap}
.cover .btn{flex:none;white-space:nowrap}
.brand svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.875rem;background:var(--surface)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700;white-space:nowrap}
.lv0{background:var(--sunk);color:var(--muted)}
.lv1{background:var(--accent-soft);color:var(--lvl1)}
.lv2{background:var(--accent-soft);color:var(--lvl2)}
.lv3{background:var(--brass-soft);color:var(--brass)}
.pill.power{background:var(--brass-soft);color:var(--brass)}
.res-pass{background:var(--good-soft);color:var(--good)}
.res-edge{background:var(--brass-soft);color:var(--brass)}
.res-fail{background:var(--bad-soft);color:var(--bad)}
.opt.idk{color:var(--muted);border-style:dashed}
.path{display:flex;flex-wrap:wrap;gap:6px}
.progress{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.sessions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sess{border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;font-size:.8rem;background:var(--surface);min-width:0}
.sess b{display:block;font-size:1rem}
.sess.done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.sess.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.wordlist{display:flex;flex-direction:column}
.wordlist .wl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.wordlist .wl:last-child{border-bottom:0}
/* Dictionary-entry card */
.entry .headword{font-family:var(--display);font-size:clamp(2.2rem,9vw,3.2rem);line-height:1;word-break:break-word}
.entry .headword .pre{color:var(--accent)}
.entry .headword .dot{color:var(--muted);padding-inline:2px}
.pos{font-style:italic;color:var(--muted)}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.part{border:1px dashed var(--line);border-radius:8px;padding:4px 10px;font-size:.9rem;background:var(--sunk)}
.part b{color:var(--ink)}
.part span{color:var(--muted)}
.ex{border-left:3px solid var(--line);padding-left:12px}
.ex .label{display:block;margin-bottom:2px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
dl.facts dt{font-weight:700;color:var(--muted);font-size:.875rem;padding-top:2px}
dl.facts dd{margin:0}
details summary{cursor:pointer;font-weight:700;color:var(--accent)}
/* Questions */
.quote{font-family:var(--display);font-size:1.35rem;line-height:1.35;background:var(--sunk);border-radius:8px;padding:16px}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--ink);margin-inline:2px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;min-height:48px;font-size:1rem}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.opts.two{grid-template-columns:1fr 1fr}
.feedback{border-radius:var(--r);padding:14px 16px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b{display:block}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:700;min-height:44px}
.tile.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile:disabled{opacity:.4}
.built{font-family:var(--display);font-size:2rem;min-height:2.6rem;border-bottom:2px dashed var(--line)}
/* Spelling */
.flash{height:132px;display:flex;align-items:center;justify-content:center;background:var(--sunk);border-radius:var(--r);font-family:var(--display);font-size:clamp(2rem,10vw,3rem)}
.speed{display:flex;gap:6px}
.speed i{flex:1;height:6px;border-radius:999px;background:var(--sunk)}
.speed i.on{background:var(--accent)}
.speed i.done{background:var(--good)}
input.spell,textarea{width:100%;font:inherit;font-size:1.25rem;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{font-size:1rem;min-height:96px;resize:vertical}
.diff{font-family:var(--display);font-size:1.6rem;letter-spacing:.04em}
.diff .x{background:var(--bad-soft);color:var(--bad);border-radius:3px;text-decoration:line-through}
.diff .m{background:var(--brass-soft);color:var(--brass);border-radius:3px;text-decoration:underline}
/* Lesson cover-up */
.cover{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cover:last-child{border-bottom:0}
.cover .w{font-family:var(--display);font-size:1.6rem}
.cover .w .hide{background:var(--ink);color:var(--ink);border-radius:4px}
/* Passage */
.story p{font-size:1.06rem;line-height:1.7;margin-bottom:12px}
.story p:last-child{margin-bottom:0}
.tw{border:0;background:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.pop{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.95rem}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tablebox{overflow-x:auto}
.note{background:var(--brass-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.9rem}
.sentence{border:1px solid var(--line);border-radius:8px;padding:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.opts.two{grid-template-columns:1fr} .sessions{gap:4px} .sess{font-size:.72rem;padding:6px 2px}}
</style>

<div class="wrap" id="app" aria-live="polite">
  <div class="topbar"><div class="brand">Learning Knight</div></div>
  <div class="panel stack"><h2>Opening your profiles…</h2><p class="muted">Loading your lessons and any saved progress.</p></div>
</div>

<script>
(() => {
"use strict";
const COURSE_URL = "content/course.json";
const LEVELS = ["New", "Learning", "Familiar", "Owned"];
const DAY = 864e5;
const app = document.getElementById("app");
let COURSE = null;       // content/course.json
let UNITS = [];          // every unit, in course order
let WORDS = [], BANK = [], FINDABLE = [], SENTENCES = [], GLOSS = {};  // looked up across the whole course
let C = null;            // the unit being worked on right now
let SWEEP = null;         // adult vocabulary sweep (content/sweep-en.json)
let DE = null;            // data engineering fundamentals (content/de-fundamentals.json)
let ASSESS = null, FORMS = {}, AITEM = {}, APASS = {};  // placement check: one file per version (form A, B…); ASSESS = the form in use
let store = null;        // storage adapter
let P = null;            // current profile {id, data}
let saveChain = Promise.resolve();

/* ---------- tiny DOM helper ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wordByKey = k => WORDS.find(w => w.key === k);
const unitById = id => UNITS.find(u => u.id === id) || null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- clock (with a testing offset so a parent can jump ahead a day) ---------- */
function today() {
  const off = (P && P.data.dayOffset) || 0;
  const d = new Date(Date.now() + off * DAY);
  return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / DAY);
}
const dayLabel = n => { const d = new Date(n * DAY); return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }); };

/* ---------- storage adapters, tried in order:
   1. claude.ai account (when opened as a claude.ai artifact)
   2. Firebase account (GitHub Pages, once firebase-config.js is filled in and the person signs in)
   3. this device only (browser storage) ---------- */
const local = {
  mode: "device", kind: "device", label: "this device",
  read() { try { return JSON.parse(localStorage.getItem("lk.profiles") || "{}"); } catch { return {}; } },
  write(all) { try { localStorage.setItem("lk.profiles", JSON.stringify(all)); return true; } catch { return false; } },
  async list() { const all = this.read(); return Object.entries(all).map(([id, data]) => ({ id, data })); },
  async save(id, data) { const all = this.read(); all[id] = data; this.write(all); },
  async remove(id) { const all = this.read(); delete all[id]; this.write(all); }
};
const deviceStore = (canSignIn) => Object.assign(Object.create(local), { canSignIn: !!canSignIn });

/* Firebase: Google sign-in per person; shareable learners (see firebaseStore and firestore.rules). */
const FB_VER = "10.12.2";
let fb = null;
const loadScript = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.append(s); });
const fbConfigured = () => { const c = window.LK_FIREBASE; return !!(c && c.apiKey && c.projectId); };
async function loadFirebase() {
  if (fb) return fb;
  for (const m of ["app", "auth", "firestore"]) await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
  firebase.initializeApp(window.LK_FIREBASE);
  const db = firebase.firestore();
  try { await db.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* offline cache is optional */ }
  fb = { auth: firebase.auth(), db };
  return fb;
}
/* Firebase learners live at learners/{id}: { ownerUid, ownerName, helpers: [uid], helperInfo: {uid: {name, email}}, p: <progress>, updatedAt }.
   The owner shares by invite link; helpers can see progress and review sentences, never change who has access.
   firestore.rules enforces all of it. */
const randomCode = () => { const a = new Uint8Array(18); crypto.getRandomValues(a); return Array.from(a, b => (b % 36).toString(36)).join(""); };
function firebaseStore(user) {
  const FV = firebase.firestore.FieldValue;
  const learners = fb.db.collection("learners");
  const me = { uid: user.uid, name: user.displayName || "", email: user.email || "" };
  const myName = me.name || me.email || "Someone";
  const wrap = (d, role) => {
    const x = d.data() || {};
    return { id: d.id, data: x.p || {}, role, meta: { ownerUid: x.ownerUid, ownerName: x.ownerName || "", helpers: x.helpers || [], helperInfo: x.helperInfo || {}, reviews: x.reviews || {} } };
  };
  let migrated = false;
  async function migrateOld() {
    // Learners saved by the first Firebase version (users/{uid}/profiles) move to the shareable location once.
    if (migrated) return; migrated = true;
    try {
      const old = await fb.db.collection("users").doc(user.uid).collection("profiles").get();
      for (const d of old.docs) {
        await learners.doc(d.id).set({ ownerUid: user.uid, ownerName: myName, helpers: [], helperInfo: {}, p: d.data(), updatedAt: FV.serverTimestamp() });
        await d.ref.delete();
      }
    } catch (e) { migrated = false; }
  }
  return {
    mode: "account", kind: "firebase", label: user.email || "your Google account", me,
    async list() {
      await migrateOld();
      const [own, shared] = await Promise.all([learners.where("ownerUid", "==", user.uid).get(), learners.where("helpers", "array-contains", user.uid).get()]);
      return [...own.docs.map(d => wrap(d, "owner")), ...shared.docs.map(d => wrap(d, "helper"))];
    },
    async create(id, data) {
      await learners.doc(id).set({ ownerUid: user.uid, ownerName: myName, helpers: [], helperInfo: {}, p: data, updatedAt: FV.serverTimestamp() });
    },
    // Saves replace only the progress field, so they can never drop a helper added from another device.
    async save(id, data) { await learners.doc(id).update({ p: data, updatedAt: FV.serverTimestamp() }); },
    async remove(id) { await learners.doc(id).delete(); },
    // Sentence reviews live in their own field, so reviewing never touches (or overwrites) the learner's progress.
    async review(id, sentenceId, review) { await learners.doc(id).update({ ["reviews." + sentenceId]: review, updatedAt: FV.serverTimestamp() }); },
    async meta(id) { const d = await learners.doc(id).get(); return d.exists ? wrap(d, "owner").meta : null; },
    async invite(id, learnerName) {
      const code = randomCode();
      await fb.db.collection("invites").doc(code).set({
        learnerId: id, learnerName, ownerUid: user.uid, ownerName: myName,
        createdAt: FV.serverTimestamp(), expiresAt: firebase.firestore.Timestamp.fromMillis(Date.now() + 7 * DAY)
      });
      return code;
    },
    async join(code) {
      const inv = await fb.db.collection("invites").doc(code).get();
      if (!inv.exists) throw { code: "invite-missing" };
      const v = inv.data();
      if (v.expiresAt.toMillis() < Date.now()) throw { code: "invite-expired" };
      if (v.ownerUid === user.uid) return { ...v, own: true };
      await learners.doc(v.learnerId).update({ helpers: FV.arrayUnion(user.uid), ["helperInfo." + user.uid]: { name: me.name, email: me.email }, joinCode: code });
      return v;
    },
    async removeHelper(id, uid) { await learners.doc(id).update({ helpers: FV.arrayRemove(uid), ["helperInfo." + uid]: FV.delete() }); },
    async leave(id) { await learners.doc(id).update({ helpers: FV.arrayRemove(user.uid), ["helperInfo." + user.uid]: FV.delete() }); }
  };
}
async function signIn() {
  try {
    await loadFirebase();
    const provider = new firebase.auth.GoogleAuthProvider();
    try { await fb.auth.signInWithPopup(provider); }
    catch (e) {
      if (e && e.code === "auth/popup-closed-by-user") return;
      if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) { await fb.auth.signInWithRedirect(provider); return; }
      throw e;
    }
    store = firebaseStore(fb.auth.currentUser);
    if (await handleJoin()) return;
    showProfiles(true);
  } catch (e) { showToast("Sign-in didn't work. Check your connection and try again."); }
}
async function signOut() {
  try { if (fb) await fb.auth.signOut(); } catch (e) {}
  store = deviceStore(true); P = null;
  showProfiles(true);
}

async function makeStore() {
  const cl = window.claude;
  if (cl && typeof cl.use === "function") {
    try {
      const [db, user] = await Promise.all([cl.use("db"), cl.use("user")]);
      const uid = user ? await user.id() : null;
      if (db && uid) {
        const col = db.collection("data/users/" + uid);
        return {
          mode: "account", kind: "claude", label: "this claude.ai account",
          async list() { const s = await col.get(); return s.docs.filter(d => d.exists).map(d => ({ id: d.id, data: JSON.parse(JSON.stringify(d.data())) })); },
          async save(id, data) { await col.doc(id).set(data); },
          async remove(id) { await col.doc(id).delete(); }
        };
      }
    } catch (e) {}
  }
  if (fbConfigured()) {
    try {
      await loadFirebase();
      const user = await new Promise(res => { const off = fb.auth.onAuthStateChanged(u => { off(); res(u); }); });
      return user ? firebaseStore(user) : deviceStore(true);
    } catch (e) { console.warn("Firebase unavailable; saving on this device", e); }
  }
  return deviceStore(false);
}
function persist() {
  if (!P || P.role === "helper") return Promise.resolve();  // helpers never write a learner's progress
  const snapshot = JSON.parse(JSON.stringify(P.data));
  const id = P.id;
  saveChain = saveChain.then(() => store.save(id, snapshot)).catch(err => {
    if (store.mode === "account") { showToast("Couldn't save to your account. Progress is kept on this device for now."); store = deviceStore(fbConfigured()); return local.save(id, snapshot); }
  });
  return saveChain;
}
let toastEl = null;
function showToast(msg) {
  if (toastEl) toastEl.remove();
  toastEl = h("div", { class: "note", role: "status", style: "position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:600px;margin:auto;z-index:5" }, msg);
  document.body.append(toastEl);

    if (what === "prefix") shuffle(C.items.filter(i => i.use === "prefix")).forEach(i => pushItem(i, "Prefix or just letters?"));
    if (what === "warmup") steps.push({ kind: "warmup", label: "Warm-up" });
    if (what === "exit") steps.push({ kind: "exit", session: sess.n, label: "Exit check" });
    if (what === "use") C.items.filter(i => i.use === "use").forEach(i => pushItem(i, { mcq: "Which word fits?", binary: "Example or non-example?", build: "Build the word", order: "Shades of meaning" }[i.type]));
    if (what === "sentence") C.sentence.forEach(s => steps.push({ kind: "sentence", task: s, label: "Use it yourself" }));
    if (what === "passage") { steps.push({ kind: "passage", label: "Read" }); C.passage.questions.forEach(q => pushItem(q, "About the story")); }

const findItem = id => FINDABLE.find(i => i.id === id) || AITEM[id] || null;
function ser(st) {
  const o = { kind: st.kind, label: typeof st.label === "string" ? st.label : "" };
  for (const k of ["check", "practice", "production", "key", "mode", "dueOnly", "max", "session", "text", "wi", "keys", "first", "right", "part", "passage"]) if (st[k] !== undefined) o[k] = st[k];
  if (st.item) o.item = st.item.id;
  if (st.word) o.word = st.word.key;
  if (st.task) o.task = st.task.id;
  return o;
}
function hyd(o) {
  const st = { ...o };
  if (o.item) { st.item = findItem(o.item); if (!st.item) return null; }
  if (o.word) { st.word = wordByKey(o.word); if (!st.word) return null; }
  if (o.task) { st.task = SENTENCES.find(s => s.id === o.task); if (!st.task) return null; }
  if (o.key && !wordByKey(o.key)) return null;
  return st;
}
const emptyResults = () => ({ right: 0, total: 0, second: 0, changes: [], checkRight: 0, checkTotal: 0, missed: [] });

async function startRun(meta, steps, used) {

  await persist();

}
function runReview() {

  return startRun({ type: "review", title: "Review" }, steps, new Set());

/* Missed words practice (Luis): study every missed word's card first, then one mixed multiple-choice
   check at the end. Missed words are shuffled in with words the learner already knows, and every
   question has the same label, so the learner can't tell which is which. First-try right clears a word. */
function runMissed() {
  const missedKeys = Object.keys(P.data.missed).filter(k => wordByKey(k));
  const steps = [], used = new Set(), quiz = [];
  missedKeys.forEach((k, i) => steps.push({ kind: "card", word: wordByKey(k), label: `Missed word ${i + 1} of ${missedKeys.length}: study it` }));
  const lvl = k => ((P.data.words[k] || {}).meaning || {}).lvl || 0;
  const others = WORDS.map(w => w.key).filter(k => !P.data.missed[k]);
  const known = others.filter(k => lvl(k) >= 2);                     // Familiar or Owned
  const pool = known.length >= 2 ? known : others.filter(k => lvl(k) >= 1);
  for (const k of missedKeys) {
    const it = mcqFor(k, new Set([P.data.missed[k].item, ...used]));
    if (it) { used.add(it.id); quiz.push({ kind: "mcq", item: it, label: "Mixed check", practice: true }); }
  }
  for (const k of shuffle(pool).slice(0, Math.max(2, missedKeys.length))) {
    const it = mcqFor(k, used);
    if (it && !used.has(it.id)) { used.add(it.id); quiz.push({ kind: "mcq", item: it, label: "Mixed check" }); }
  }
  steps.push({ kind: "note", label: "Mixed check", text: `Now a mixed check: ${quiz.length} questions. Some are on the words you just studied and some are on words you already know, in random order.` });
  steps.push(...orderMixed(quiz, missedKeys[missedKeys.length - 1]));
  return startRun({ type: "missed", title: "Missed words" }, steps, used);
}
/* Order the mixed check so it isn't a memory echo of the cards (Luis):
   open with a word they already know, and keep the word studied last out of the first two questions. */
function orderMixed(quiz, lastKey) {
  const order = shuffle(quiz);
  const firstKnown = order.findIndex(q => !q.practice);
  if (firstKnown > 0) order.unshift(order.splice(firstKnown, 1)[0]);
  const li = order.findIndex(q => q.practice && q.item.words.includes(lastKey));
  if (li > -1 && li < 2) {
    if (order.length > 2) {
      const [q] = order.splice(li, 1);
      order.splice(2 + Math.floor(Math.random() * (order.length - 1)), 0, q);
    } else if (order.length === 2 && li === 0) order.reverse();
  }
  return order;
}

async function continueRun() {
  const run = P.data.run;
  if (!run) return showHome();
  syncUnit();
  if (run.type === "assess") useForm(run.assess.form || "A");
  const unit = C;
  const used = new Set(run.used || []);
  const R = run.results;
  inSession = true;
  let shownPassage = null;   // which passage the reader has in front of them this sitting
  try {
    for (let i = run.i; i < run.steps.length; i++) {
      run.i = i;
      const o = run.steps[i];
      // Warm-ups and exit checks expand into questions when reached, so they use current due dates.
      if (o.kind === "warmup") {
        const items = [];
        for (const k of dueWords().slice(0, o.max || 5)) {
          if (needsProduction(k)) { items.push({ kind: "produce", key: k, label: o.label }); continue; }
          const it = bankFor(k, used); if (it) { used.add(it.id); items.push(ser({ kind: it.type, item: it, label: o.label })); }
        }
        run.steps.splice(i, 1, ...(items.length ? items : [{ kind: "note", label: o.label, text: "Nothing is due for review yet, so there's no warm-up today." }]));
        run.used = [...used]; i--; continue;
      }
      // The placement check picks its next level from the answers so far.
      if (o.kind === "anext") { run.steps.splice(i, 1, ...expandAssess(run, o)); i--; continue; }
      if (o.kind === "exit") {
        const keys = C.words.filter(w => w.session === o.session || (o.session > 1 && w.session < o.session)).map(w => w.key);
        const picks = shuffle(keys).slice(0, 3).map(k => bankFor(k, used)).filter(Boolean);
        picks.forEach(it => used.add(it.id));
        run.steps.splice(i, 1, ...picks.map(it => ser({ kind: it.type, item: it, label: "Exit check" })));
        run.used = [...used]; i--; continue;
      }
      const st = hyd(o);
      if (!st) continue;  // content changed since this run was saved; skip the missing piece
      if (st.kind === "apassage") shownPassage = st.passage;
      if (st.kind === "aq" && st.item.passage && st.item.passage !== shownPassage) {
        const again = await renderStep({ kind: "apassage", passage: st.item.passage, label: "Read it again before you continue" }, { i, n: run.steps.length, title: run.title });
        if (again === "leave") { await persist(); inSession = false; showHome(); return; }
        shownPassage = st.item.passage;
      }
      st.save = () => { o.wi = st.wi; o.keys = st.keys; o.first = st.first; o.right = st.right; persist(); };
      const out = await renderStep(st, { i, n: run.steps.length, title: run.title });
      if (out === "leave") { await persist(); inSession = false; showHome(); return; }
      if (out && out.assess) { if (run.type === "sweep") sweepRecord(run, out.assess); else if (run.type === "diag") run.diag.answers.push(out.assess); else run.assess.answers.push(out.assess); }
      if (out && typeof out === "object") {
        if (out.graded) { R.total++; if (out.ok) R.right++; if (st.check) { R.checkTotal++; if (out.ok) R.checkRight++; } }
        (out.changes || []).forEach(c => c && R.changes.push(c));
        if (out.second) R.second++;
        (out.missed || []).forEach(k => { if (!R.missed.includes(k)) R.missed.push(k); });
      }
      run.i = i + 1;
      run.used = [...used];
      await persist();
    }
  } finally { inSession = false; }
  delete P.data.run;
  if (run.type === "sweep") { await persist(); return sweepSummary(run); }
  if (run.type === "diag") {
    const res = diagResult(run);
    P.data.de = P.data.de || {}; (P.data.de[res.topic] = P.data.de[res.topic] || []).push(res);
    await persist();
    return showDiagResult(res, showHome);
  }
  if (run.type === "assess") {
    const res = assessResult(run);
    P.data.assessments.push(res);
    await persist();
    return showAssessResult(res, showHome);
  }
  const sess = run.type === "session" ? unit.sessions.find(s => s.n === run.n) : null;
  if (sess) { const u = (P.data.units[unit.id] = P.data.units[unit.id] || { sessions: {} }); u.sessions[sess.n] = { day: today(), at: Date.now() }; }
  await persist();
  summary(unit, sess, { ...R, missed: new Set(R.missed) }, run.type === "missed" ? "Missed words practice" : run.type === "review" ? "Review" : null);
}

  /* Flash and spell (Luis's ladder): fast flash first; right = next word.
     A miss starts the climb at slow. Each speed repeats until it's right, then moves up:
     slow → normal → fast. Three misses at one speed: copy it while it's visible, and it comes back tomorrow. */
  spell(st, body, done) {
    const keys = st.keys || (st.keys = st.dueOnly ? dueWords("spelling") : C.words.map(w => w.key).filter(k => st.mode === "learn" ? true : ((P.data.words[k] || {}).spelling || {}).lvl > 0));
    const times = C.spellingTimes, MAX = 3, climb = ["slow", "normal", "fast"];
    let wi = st.wi || 0; st.first = st.first || 0; st.right = st.right || 0;
    const changes = [];
    const intro = () => {
      body.replaceChildren(
        h("h2", null, st.mode === "learn" ? "Flash and spell" : "Spelling review"),
        h("p", null, "Each word flashes fast, then you type it from memory. Right, and you move on. Miss it, and it comes back slow until you get it, then normal, then fast."),
        wi ? h("p", { class: "note" }, `Picking up where you left off: word ${wi + 1} of ${keys.length}.`) : null,
        h("p", { class: "small muted" }, `${keys.length} words · fast ${times.fast / 1000}s · normal ${times.normal / 1000}s · slow ${times.slow / 1000}s`),
        continueBtn(nextWord, wi ? "Keep going" : "Start"));

          continueBtn(() => done({ graded: false, changes })));
        return;
      }
      const w = wordByKey(keys[wi]);
      let stage = -1, misses = 0, firstOk = false, lastOk = false;   // stage -1 = the first fast flash; 0..2 = climb

      const climbBar = () => h("div", { class: "stack-s" },
        h("div", { class: "speed", "aria-hidden": "true" }, climb.map((s, i) => h("i", { class: i < stage ? "done" : i === stage ? "on" : "" }))),
        h("div", { class: "row between small muted" }, climb.map(s => h("span", null, s))));
      const attempt = () => {
        const speed = speedNow();
        const flash = h("div", { class: "flash", "aria-live": "off" }, "Ready?");
        const go = h("button", { class: "btn primary wide" }, `Flash it (${speed})`);
        // Try counts are logged in attempts for the parent view, never shown to the learner.
        const info = stage < 0 ? "First flash: fast" : `${speed} speed`;
        body.replaceChildren(h("div", { class: "row between" }, h("span", { class: "label" }, `Word ${wi + 1} of ${keys.length}`), h("span", { class: "small muted" }, info)),
          stage >= 0 ? climbBar() : null, flash, go);
        setTimeout(() => go.focus(), 30);
        go.addEventListener("click", () => {
          go.remove();
          flash.textContent = w.word; say(w.word);
          setTimeout(() => {
            flash.textContent = "?";
            const inp = h("input", { class: "spell", id: "spell-input", autocomplete: "off", autocorrect: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Type the word you saw", inputmode: "text" });
            const sub = h("button", { class: "btn primary wide" }, "Check spelling");
            const again = hasSpeech() ? h("button", { class: "btn small", onclick: () => say(w.word) }, "▶ Hear it again") : null;
            body.append(inp, h("div", { class: "row" }, again), sub);
            inp.focus();
            const check = () => {
              const val = inp.value.trim().toLowerCase();
              if (!val) { inp.focus(); return; }
              const ok = val === w.word;
              if (stage < 0) firstOk = ok;
              lastOk = ok;
              P.data.attempts.push({ at: Date.now(), day: today(), w: w.key, s: "spelling", type: "spell-" + speed, ok, item: "spell", resp: val });
              inp.disabled = true; sub.remove();
              body.append(ok ? feedbackBox(true, `Spelled right at ${speed} speed.`) : spellFeedback(w, val));
              let next, label;
              if (ok) {
                if (stage < 0 || stage === climb.length - 1) { next = finishWord; label = "Next word"; }
                else { stage++; misses = 0; next = attempt; label = `Next: ${climb[stage]} speed`; }
              } else if (stage < 0) { stage = 0; misses = 0; next = attempt; label = "Try it slow"; }
              else if (++misses >= MAX) { next = copyIt; label = "See it spelled out"; }
              else { next = attempt; label = `Try ${speed} again`; }
              body.append(continueBtn(next, label));
            };
            sub.addEventListener("click", check);
            inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
          }, times[speed]);
        });
      };
      const copyIt = () => {
        lastOk = false;
        const inp = h("input", { class: "spell", id: "copy-input", autocomplete: "off", autocorrect: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Type the word while you look at it" });
        const msg = h("p", { class: "small muted" }, "Type the whole word while you look at it. It'll come back for practice tomorrow.");
        const sub = h("button", { class: "btn primary wide" }, "Done");
        const go = () => {
          if (inp.value.trim().toLowerCase() === w.word) finishWord();
          else { msg.textContent = "Check each letter against the word above, then try again."; inp.focus(); }
        };
        sub.addEventListener("click", go);
        inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
        body.replaceChildren(h("h3", null, "Copy it while you can see it"),
          h("div", { class: "flash" }, w.word),
          h("p", { class: "muted", style: "text-align:center" }, w.chunks ? "Say it in chunks: " + w.chunks.join(" · ") : "Built from: " + w.parts.map(p => p.t).join(" + ")), msg, inp, sub);
        inp.focus();
      };
      const finishWord = () => {
        if (firstOk) st.first++;
        if (lastOk) st.right++;
        if (st.mode === "learn") introduce(w.key, "spelling");
        else changes.push(record(w.key, "spelling", lastOk, "spell", { item: "spell-review", production: true }));
        wi++; st.wi = wi;
        if (st.save) st.save();
        nextWord();
      };
      attempt();
    };
    intro();
  }
};

/* spelling feedback: show exactly where it went wrong, with the word-part reason */
function lcsMask(a, b) {
  const m = a.length, n = b.length, dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const keepA = new Array(m).fill(false), keepB = new Array(n).fill(false);
  let i = 0, j = 0;
  while (i < m && j < n) { if (a[i] === b[j]) { keepA[i] = keepB[j] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  return { keepA, keepB };
}
function spellFeedback(w, val) {
  const { keepA, keepB } = lcsMask(val, w.word);
  const yours = h("div", { class: "diff" }, [...val].map((ch, i) => keepA[i] ? ch : h("span", { class: "x" }, ch)));
  const right = h("div", { class: "diff" }, [...w.word].map((ch, i) => keepB[i] ? ch : h("span", { class: "m" }, ch)));
  const known = (w.spelling || []).find(s => s.slip === val);
  const tip = known ? known.tip : w.chunks ? "Say it in chunks as you type: " + w.chunks.join(" · ") + "." : "Build it from its parts: " + w.parts.map(p => p.t).join(" + ") + ".";
  return h("div", { class: "feedback no stack-s", role: "status" },
    h("b", null, "Not quite."),
    h("div", null, h("span", { class: "label" }, "You typed"), yours),
    h("div", null, h("span", { class: "label" }, "Correct"), right),
    h("p", null, tip));
}

/* ================= PLACEMENT CHECK =================
   Vocabulary, then word parts, then reading. Each level is 10 questions and passes at ASSESS.passMark (90%).
   Pass a level: go up. Fail before passing anything: go down. Just missed (70-89%) above a passed level:
   try one more up, to find the edge. Nothing is shown right or wrong until the end. */
const LEVEL_NAMES = { g4: "Grade 4", g6: "Grade 6", g8: "Grade 8", g10: "Grade 10", g12: "Grade 12", col: "College", pro: "Professional" };
const levelName = id => LEVEL_NAMES[id] || "Below Grade 4";
const aLevels = part => (part === "vocab" ? ASSESS.vocab.levels : ASSESS.reading.levels).map(l => l.id);
const share = x => (x && x.total ? x.right / x.total : 0);
function aScores(answers, part) {
  const s = {};
  answers.filter(a => a.part === part).forEach(a => { const x = (s[a.level] = s[a.level] || { right: 0, total: 0 }); x.total++; if (a.ok) x.right++; });
  return s;
}
function aNextLevel(part, answers, start, tried) {
  const order = aLevels(part), S = aScores(answers, part), pass = ASSESS.passMark;
  if (!tried.length) return start;
  const last = tried[tried.length - 1], li = order.indexOf(last), s = share(S[last]);
  const up = order[li + 1], down = order[li - 1], fresh = l => l && !S[l];
  if (s >= pass) return fresh(up) ? up : null;
  if (!tried.some(l => share(S[l]) >= pass)) return fresh(down) ? down : null;
  const passedBelow = tried.some(l => order.indexOf(l) < li && share(S[l]) >= pass);
  return passedBelow && s >= ASSESS.keepGoing && fresh(up) ? up : null;
}
// Secure level: the highest level passed with every tested level below it passed too.
function aSecure(part, S) {
  let best = null;
  for (const l of aLevels(part)) { if (!S[l]) continue; if (share(S[l]) >= ASSESS.passMark) best = l; else break; }
  return best;
}
function readingStart(answers) {
  const v = aSecure("vocab", aScores(answers, "vocab")), order = aLevels("reading");
  if (!v || aLevels("vocab").indexOf(v) < aLevels("vocab").indexOf(order[0])) return order[0];
  return order.includes(v) ? v : order[order.length - 1];
}
function aLevelSteps(part, level) {
  if (part === "vocab") return shuffle(ASSESS.vocab.levels.find(l => l.id === level).items).map(it => ({ kind: "aq", item: it.id, label: "Vocabulary" }));
  const steps = [];
  for (const p of shuffle(ASSESS.reading.levels.find(l => l.id === level).passages)) {
    steps.push({ kind: "apassage", passage: p.id, label: "Reading" });
    p.questions.forEach(q => steps.push({ kind: "aq", item: q.id, label: `Reading · ${p.title}` }));
  }
  return steps;
}
function expandAssess(run, o) {
  const A = run.assess;
  if (o.part === "parts") return [
    { kind: "note", label: "Word parts", text: "Next, eight less common words. Some may be new to you. Look at the parts of each word to work out what it means." },
    ...shuffle(ASSESS.vocab.parts).map(it => ({ kind: "aq", item: it.id, label: "Word parts" }))];
  const start = o.part === "vocab" ? ASSESS.vocab.start : readingStart(A.answers);
  const lvl = aNextLevel(o.part, A.answers, start, A.tried[o.part]);
  if (!lvl) return [];
  A.tried[o.part].push(lvl);
  return [...aLevelSteps(o.part, lvl), { kind: "anext", part: o.part }];
}
/* Versions (Luis): a first check uses A; a retake uses a version that learner hasn't taken, so the questions are new. */
const formKeys = () => Object.keys(FORMS).sort();
const takenForms = d => new Set((d.assessments || []).map(a => a.form));
const nextForm = d => formKeys().find(f => !takenForms(d).has(f)) || null;
const useForm = f => { if (FORMS[f]) ASSESS = FORMS[f]; return ASSESS; };
const versionLine = r => `Vocabulary: ${levelName(r.vocab.secure)} · Reading: ${r.reading.secure ? levelName(r.reading.secure) : "Below Grade 6"}`;
function runAssess(form) {
  const d = P.data;
  form = (typeof form === "string" && FORMS[form]) ? form : (nextForm(d) || formKeys()[(d.assessments || []).length % formKeys().length]);
  useForm(form);
  const steps = [
    { kind: "note", label: "Placement check", text: ASSESS.about + " Answer on your own, without looking anything up. If you don't know a word, choose \"I don't know\": a guess that happens to be right makes your results less useful." },
    { kind: "note", label: "Vocabulary", text: "Part 1: vocabulary. Each question shows a word in a sentence. Pick what it means." },
    { kind: "anext", part: "vocab" },
    { kind: "anext", part: "parts" },
    { kind: "note", label: "Reading", text: "Part 2: reading. Read each passage, then answer five questions. You can reread the passage while you answer." },
    { kind: "anext", part: "reading" }];

}
function assessResult(run) {
  const ans = run.assess.answers;
  const V = aScores(ans, "vocab"), Rd = aScores(ans, "reading");
  const parts = ans.filter(a => a.part === "parts");
  const skills = {};
  ans.filter(a => a.part === "reading").forEach(a => { const s = (skills[a.skill] = skills[a.skill] || { right: 0, total: 0 }); s.total++; if (a.ok) s.right++; });
  return {
    id: "a-" + Date.now(), form: ASSESS.form, version: ASSESS.version, day: today(), at: Date.now(), passMark: ASSESS.passMark,
    vocab: { levels: V, secure: aSecure("vocab", V) },
    parts: { right: parts.filter(a => a.ok).length, total: parts.length },

}
const boldWord = s => { const n = h("p", { class: "quote" }); s.split(/(\[[^\]]+\])/).forEach(c => n.append(/^\[.+\]$/.test(c) ? h("b", { style: "color:var(--accent)" }, c.slice(1, -1)) : c)); return n; };

RENDER.aq = (st, body, done) => {

  else body.append(h("p", { class: "muted" }, "What does the word in bold mean here?"), boldWord(it.sentence));
  const order = shuffle(it.options.map((_, i) => i));
  const opts = h("div", { class: "opts" });
  const next = h("button", { class: "btn primary wide", disabled: true }, "Next");
  let picked = null;
  const pick = (i, btn) => { picked = i; [...opts.children].forEach(b => b.classList.toggle("picked", b === btn)); next.disabled = false; };
  order.forEach(i => opts.append(h("button", { class: "opt", onclick: e => pick(i, e.currentTarget) }, it.options[i])));

  next.addEventListener("click", () => done({ assess: { id: it.id, part: it.part, level: it.level, skill: it.skill || null, ok: picked === it.answer, pick: picked >= 0 ? it.options[picked] : null } }));

/* Results: levels with scores, the reading skill profile, what it means, and everything missed. */
function levelChip(S, l) {
  const x = S[l];
  if (!x) return h("span", { class: "pill lv0" }, `${levelName(l)} · not tested`);
  const s = share(x), cls = s >= ASSESS.passMark ? "res-pass" : s >= ASSESS.keepGoing ? "res-edge" : "res-fail";
  return h("span", { class: "pill " + cls }, `${levelName(l)} · ${x.right}/${x.total}`);
}
function assessReading(res) {

/* ================= VOCABULARY SWEEP (adult track) =================
   Every word in a level gets one quick check, 20 at a time. Right first time = known; wrong or
   "I don't know" = goes on the words-to-learn list. A week later, known words come back once
   (a confirm round) so a lucky guess can't hide a gap. The next level opens as soon as a level
   is swept. Word cards are written for the words-to-learn list only. */
const sweepState = (d, lv) => { d.sweep = d.sweep || {}; return (d.sweep[lv] = d.sweep[lv] || { words: {} }); };
function sweepStats(d, L) {

  const st = { total: L.items.length, checked: 0, known: 0, learn: 0, confirmed: 0, confirmDue: 0 };
  for (const it of L.items) {

    st.checked++;
    if (w.status === "learn") st.learn++;
    else { st.known++; if (w.confirmed) st.confirmed++; else if (t - w.day >= SWEEP.confirmAfter) st.confirmDue++; }
  }
  return st;
}

  const L = SWEEP.levels.find(x => x.id === level), S = sweepState(P.data, level).words, t = today();
  const pool = mode === "confirm"
    ? L.items.filter(it => S[it.id] && S[it.id].status === "known" && !S[it.id].confirmed && t - S[it.id].day >= SWEEP.confirmAfter)
    : L.items.filter(it => !S[it.id]);
  const pick = shuffle(pool).slice(0, SWEEP.batch);
  const label = `${L.name} · ${mode === "confirm" ? "confirm round" : "sweep"}`;
  const steps = pick.map(it => ({ kind: "aq", item: AITEM[it.id], label }));   // startRun saves each step by item id
  return startRun({ type: "sweep", title: `Vocabulary sweep · ${L.name}`, sweep: { level, mode, ids: pick.map(i => i.id) } }, steps, new Set());
}

  const S = sweepState(P.data, run.sweep.level).words, prev = S[a.id];

      : h("p", { class: "panel" }, "Nothing missed in this batch."),

/* Invite links look like …/LearningKnight/?join=CODE. Accepting needs a signed-in Google account. */
let pendingJoin = (() => { try { return new URLSearchParams(location.search).get("join"); } catch (e) { return null; } })();
function clearJoinParam() { try { const u = new URL(location.href); u.searchParams.delete("join"); history.replaceState(null, "", u.pathname + u.search + u.hash); } catch (e) {} }
async function handleJoin() {
  if (!pendingJoin) return false;
  if (store.kind !== "firebase") {
    if (!store.canSignIn) { pendingJoin = null; clearJoinParam(); return false; }
    frame(h("div", { class: "panel stack" },
      h("h2", null, "You've been invited"),
      h("p", null, "Someone shared a learner's progress with you. Sign in with Google to accept, and they'll appear under Shared with you."),
      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: signIn }, "Sign in with Google"),
        h("button", { class: "btn ghost", onclick: () => { pendingJoin = null; clearJoinParam(); showProfiles(true); } }, "Not now"))));
    return true;
  }
  const code = pendingJoin; pendingJoin = null; clearJoinParam();
  frame(h("div", { class: "panel" }, h("p", null, "Opening the invite…")));
  try {
    const v = await store.join(code);
    showToast(v.own ? "That invite is for your own learner." : `You can now follow ${v.learnerName || "their"} progress. Find them under Shared with you.`);
  } catch (e) {
    showToast(e && e.code === "invite-expired" ? "That invite link has expired. Ask for a new one." : "That invite link didn't work. Ask for a new one.");
  }
  showProfiles(true);
  return true;
}

async function showParent() {
  ensure(P); syncUnit();
  // Pick up helpers who joined (or reviews made) since this learner was loaded.
  if (store.meta && !showParent.refreshing) {
    showParent.refreshing = true;
    store.meta(P.id).then(m => {
      showParent.refreshing = false;
      if (m && P && JSON.stringify(m) !== JSON.stringify(P.meta)) { P.meta = m; if (screen === "parent") showParent(); }
    }).catch(() => { showParent.refreshing = false; });
  }
  const d = P.data, t = today();
  const attempts = d.attempts.filter(a => a.w);
  const misses = {};
  attempts.filter(a => !a.ok && a.resp).forEach(a => {
    const m = (misses[a.w] = misses[a.w] || []);
    if (a.s === "spelling") m.push("spelled “" + a.resp + "”");
    else if (!["Fits", "Doesn't fit", "Example", "Non-example"].includes(a.resp)) m.push("picked “" + a.resp + "”");
    else m.push("missed a yes/no question");
  });
  const sticky = Object.entries(misses).sort((a, b) => b[1].length - a[1].length).slice(0, 4);
  const graded = attempts.filter(a => a.s === "meaning");
  const acc = graded.length ? Math.round(100 * graded.filter(a => a.ok).length / graded.length) : null;
  const reviewOf = s => (P.meta && P.meta.reviews && P.meta.reviews[s.id]) || s.review || null;
  const queue = d.sentences.filter(s => !reviewOf(s));
  const reviewed = d.sentences.filter(s => reviewOf(s)).map(s => ({ ...s, review: reviewOf(s) }));
  const helper = isHelper(), owner = !helper;

  const sentenceCard = s => {
    const note = h("input", { class: "spell", id: "note-" + s.id, placeholder: "Optional note", style: "font-size:.95rem" });
    const mark = async verdict => {
      const review = { verdict, note: note.value.trim(), day: t, by: (store.me && (store.me.name || store.me.email)) || "" };
      try {
        if (store.review) { await store.review(P.id, s.id, review); P.meta = P.meta || {}; P.meta.reviews = { ...(P.meta.reviews || {}), [s.id]: review }; }
        else { s.review = review; await persist(); }
      } catch (e) { showToast("Couldn't save that review. Check your connection and try again."); return; }
      showParent();
    };
    return h("div", { class: "sentence stack-s" },
      h("span", { class: "label" }, (wordByKey(s.word) ? wordByKey(s.word).word : s.word) + " · " + dayLabel(s.day)),
      h("p", null, "“", s.text, "”"),
      note,
      h("div", { class: "row" }, h("button", { class: "btn small", onclick: () => mark("good") }, "Good"), h("button", { class: "btn small", onclick: () => mark("needs-work") }, "Needs work")));
  };
  const resetBox = h("div", { class: "row" });
  const askReset = () => resetBox.replaceChildren(h("span", { class: "small" }, `Erase all of ${d.name}'s progress?`),
    h("button", { class: "btn small", onclick: async () => { const name = d.name, id = P.id; P.data = newProfile(name); P.id = id; await persist(); showParent(); } }, "Yes, erase"),
    h("button", { class: "btn small ghost", onclick: () => resetBox.replaceChildren(resetBtn) }, "Cancel"));
  const resetBtn = h("button", { class: "btn small", onclick: askReset }, "Reset this learner");
  resetBox.append(resetBtn);

  // Sharing (owner, signed in): invite helpers by link, see who has access, remove anyone.
  let sharePanel = null;
  if (owner && store.kind === "firebase" && store.invite) {
    const helpers = (P.meta && P.meta.helpers) || [];
    const info = (P.meta && P.meta.helperInfo) || {};
    const linkBox = h("div", { class: "stack-s" });
    const makeLink = async () => {
      linkBox.replaceChildren(h("p", { class: "small muted" }, "Creating a link…"));
      try {
        const code = await store.invite(P.id, d.name);
        const url = location.origin + location.pathname + "?join=" + code;
        const field = h("input", { class: "spell", id: "invite-link", value: url, readonly: true, style: "font-size:.85rem" });
        const copy = h("button", { class: "btn small" }, "Copy link");
        copy.addEventListener("click", async () => { try { await navigator.clipboard.writeText(url); copy.textContent = "Copied"; } catch (e) { field.select(); } });
        linkBox.replaceChildren(field, h("div", { class: "row" }, copy),
          h("p", { class: "small muted" }, `Send it to the people who should see ${d.name}'s progress. It works for 7 days. They'll need to sign in with Google.`));
      } catch (e) { linkBox.replaceChildren(h("p", { class: "small" }, "Couldn't create a link. Check your connection and try again.")); }
    };
    sharePanel = h("section", { class: "panel stack-s" },
      h("h3", null, "Share progress"),
      h("p", { class: "small muted" }, "People you share with can see this page and review sentences. They can't change progress or who has access."),
      helpers.length ? h("div", { class: "wordlist" }, helpers.map(uid => {
        const who = info[uid] || {};
        return h("div", { class: "wl" }, h("span", null, who.name || who.email || "Someone", who.email && who.name ? h("span", { class: "small muted" }, " · " + who.email) : null),
          h("button", { class: "btn small ghost", onclick: async () => {
            try { await store.removeHelper(P.id, uid); P.meta.helpers = helpers.filter(x => x !== uid); delete info[uid]; showParent(); }
            catch (e) { showToast("Couldn't remove them. Check your connection and try again."); }
          } }, "Remove"));
      })) : h("p", { class: "small" }, "Not shared with anyone yet."),
      h("button", { class: "btn", onclick: makeLink }, "Create invite link"),
      linkBox);
  }
  const helperBanner = helper ? h("div", { class: "note row between" },
    h("span", null, `Shared with you by ${(P.meta && P.meta.ownerName) || "the owner"}. You can follow progress and review sentences.`),
    h("button", { class: "btn small ghost", onclick: async () => {
      try { await store.leave(P.id); showToast(`You'll no longer see ${d.name}'s progress.`); showProfiles(true); }
      catch (e) { showToast("Couldn't do that right now. Check your connection and try again."); }
    } }, "Stop following")) : null;

  const adult = isAdult(d);
  const trackPanel = helper ? null : h("section", { class: "panel stack-s" },
    h("h3", null, "Learning track"),
    h("div", { class: "row" }, [["course", "Band 6 course"], ["adult", "Adult track"]].map(([k, label]) =>
      h("button", { class: "btn small" + (d.track === k ? " primary" : ""), "aria-pressed": String(d.track === k), onclick: async () => { d.track = k; await persist(); showParent(); } }, label))),
    h("p", { class: "small muted" }, d.track === "course" ? "Kids and teens: the Band 6 vocabulary course, one unit at a time." : "Adults: the placement check first, then only the tracks switched on here."),
    adult ? TRACKS.map(tr => {
      const cb = h("input", { type: "checkbox", id: "tr-" + tr.id, checked: d.tracks.includes(tr.id) || null, disabled: tr.soon || null });
      cb.addEventListener("change", async () => { d.tracks = cb.checked ? [...new Set([...d.tracks, tr.id])] : d.tracks.filter(x => x !== tr.id); await persist(); });
      return h("label", { class: "check", for: "tr-" + tr.id }, cb, h("span", null, h("b", null, tr.name), tr.soon ? " (coming soon)" : "", h("br"), h("span", { class: "small muted" }, tr.about)));
    }) : null);
  frame(h("div", { class: "stack" },
    h("div", { class: "row between" }, h("h1", null, d.name + (adult ? "'s progress" : "'s week")), h("button", { class: "btn", onclick: helper ? () => showProfiles(true) : showHome }, "Back")),
    helperBanner,
    trackPanel,
    adult ? null : h("div", { class: "stats" },
      h("div", { class: "stat" }, h("b", null, allDone(d) ? "All ✓" : Object.keys(sessionsIn(d, C)).length + "/" + C.sessions.length), h("span", { class: "small muted" }, allDone(d) ? `${UNITS.length} units` : `Unit ${C.unit} sessions`)),
      h("div", { class: "stat" }, h("b", null, acc === null ? "–" : acc + "%"), h("span", { class: "small muted" }, "meaning right")),
      h("div", { class: "stat" }, h("b", null, queue.length), h("span", { class: "small muted" }, "to review"))),

    DE && d.de && Object.keys(d.de).length ? h("section", { class: "panel stack-s" },
      h("h3", null, "Data engineering"),
      DE.topics.filter(T => deResults(d, T.id).length).map(T => { const r = deResults(d, T.id).slice(-1)[0];
        return h("div", { class: "row between" }, h("span", { class: "small" }, h("b", null, `${T.id} ${T.title}`), ` · ${r.right}/${r.total} · ${dayLabel(r.day)}`),
          h("button", { class: "btn small", onclick: () => showDiagResult(r, showParent) }, "Results")); })) : null,
    SWEEP && d.sweep && Object.keys(d.sweep).length ? h("section", { class: "panel stack-s" },
      h("h3", null, "Vocabulary sweep"),
      SWEEP.levels.map(L => ({ L, st: sweepStats(d, L) })).filter(x => x.st.checked).map(({ L, st }) =>
        h("p", { class: "small" }, h("b", null, L.name), ` · ${st.checked}/${st.total} checked · ${st.learn} to learn · ${st.confirmed} confirmed`))) : null,
    (d.assessments || []).length ? h("section", { class: "panel stack-s" },
      h("h3", null, "Placement checks"),
      h("div", { class: "wordlist" }, d.assessments.slice().reverse().map(r => h("div", { class: "wl", style: "gap:10px" },
        h("span", { class: "small" }, h("b", null, `Version ${r.form}`), ` · ${dayLabel(r.day)}`, h("br"), versionLine(r)),
        h("button", { class: "btn small", onclick: () => showAssessResult(r, showParent) }, "Results"))))) : null,

    adult ? null : h("section", { class: "panel stack-s" },
      h("h3", null, `Talk about it this week (Unit ${C.unit})`),
      h("p", { class: "small muted" }, "Using a word in real conversation is one of the strongest ways it sticks."),
      h("ul", { class: "stack-s", style: "margin:0;padding-left:20px" }, C.parentPrompts.map(p => h("li", null, p)))),

    adult ? null : h("section", { class: "panel stack-s" },
      h("h3", null, "Missed words list"),
      h("p", { class: "small muted" }, "Still wrong after the last chance. A word comes off when they get it right in practice."),
      Object.keys(d.missed).length ? h("div", { class: "tablebox" }, h("table", null,
        h("thead", null, h("tr", null, h("th", null, "Word"), h("th", null, "Their answer"), h("th", null, "When"))),
        h("tbody", null, Object.entries(d.missed).map(([k, m]) => h("tr", null,
          h("td", null, wordByKey(k) ? wordByKey(k).word : k, m.times > 1 ? h("span", { class: "small muted" }, ` ×${m.times}`) : null),
          h("td", { class: "small" }, m.picked || "–"),
          h("td", { class: "small" }, dayLabel(m.day)))))))
        : h("p", { class: "muted" }, "Empty. Nothing missed twice.")),

    adult ? null : h("section", { class: "panel stack-s" },
      h("h3", null, "Sticky words"),
      sticky.length ? sticky.map(([k, resps]) => h("div", { class: "stack-s", style: "padding-block:6px;border-bottom:1px solid var(--line)" },
        h("div", { class: "row between" }, h("b", null, wordByKey(k) ? wordByKey(k).word : k), h("span", { class: "small muted" }, `${resps.length} miss${resps.length === 1 ? "" : "es"}`)),
        h("p", { class: "small muted" }, [...new Set(resps)].slice(0, 4).join(" · "))))
        : h("p", { class: "muted" }, "No misses yet.")),

    adult && !d.sentences.length ? null : h("section", { class: "panel stack-s" },
      h("h3", null, "Sentences to review"),
      h("p", { class: "small muted" }, "Your verdicts become the test set for automatic grading later."),
      queue.length ? queue.map(sentenceCard) : h("p", { class: "muted" }, "Nothing waiting. Sentences arrive in Session 4."),
      reviewed.length ? h("details", null, h("summary", null, `Reviewed (${reviewed.length})`), h("div", { class: "stack-s", style: "margin-top:8px" }, reviewed.map(s => h("p", { class: "small" }, h("b", null, s.review.verdict === "good" ? "Good: " : "Needs work: "), s.text, s.review.note ? ` (${s.review.note})` : "")))) : null),

    adult ? null : h("section", { class: "panel stack-s" },
      h("h3", null, "Every word"),
      h("div", { class: "tablebox" }, h("table", null,
        h("thead", null, h("tr", null, h("th", null, "Word"), h("th", null, "Meaning"), h("th", null, "Spelling"), h("th", null, "Next review"))),
        // Every unit up to the current one, grouped; later units haven't started.
        h("tbody", null, UNITS.slice(0, UNITS.indexOf(C) + 1).map(u => [
          UNITS.length > 1 ? h("tr", null, h("th", { colspan: "4", style: "padding-top:12px" }, `Unit ${u.unit}: ${u.title}`)) : null,
          u.words.map(w => {
            const m = (d.words[w.key] || {}).meaning, s = (d.words[w.key] || {}).spelling;
            const nxt = [m, s].filter(x => x && x.next !== null).map(x => x.next);
            return h("tr", null, h("td", null, w.word), h("td", null, lvlPill(m ? m.lvl : 0)), h("td", null, lvlPill(s ? s.lvl : 0)),
              h("td", { class: "small" }, nxt.length ? (Math.min(...nxt) <= t ? "Due now" : dayLabel(Math.min(...nxt))) : "–"));
          })]))))),

    sharePanel,

    helper ? null : h("section", { class: "panel stack-s" },
      h("h3", null, "Testing tools"),
      h("p", { class: "small muted" }, `For trying the prototype without waiting a real day. App date: ${dayLabel(t)}${d.dayOffset ? ` (${d.dayOffset} day${d.dayOffset === 1 ? "" : "s"} ahead)` : ""}.`),
      h("div", { class: "row" },
        h("button", { class: "btn small", onclick: async () => { d.dayOffset = (d.dayOffset || 0) + 1; await persist(); showParent(); } }, "Skip ahead one day"),
        d.dayOffset ? h("button", { class: "btn small ghost", onclick: async () => { d.dayOffset = 0; await persist(); showParent(); } }, "Back to today") : null),
      resetBox,
      h("p", { class: "small muted" }, store.mode === "account" ? `Saved to ${store.label}.` : "Saved on this device only.")),

    h("section", { class: "panel stack-s" },
      h("h3", null, "Account"),
      store.kind === "firebase"
        ? h("div", { class: "row between" }, h("p", { class: "small" }, `Signed in as ${store.label}.`), h("button", { class: "btn small", onclick: signOut }, "Sign out"))
        : store.canSignIn
          ? h("div", { class: "stack-s" }, h("p", { class: "small" }, "Saving on this device only. Sign in with Google to sync between phone and laptop."), h("button", { class: "btn small", onclick: signIn }, "Sign in with Google"))
          : h("p", { class: "small muted" }, store.kind === "claude" ? "Saved to this claude.ai account." : "Saved on this device only."))
  ));
  screen = "parent";
}

/* ================= BOOT ================= */
async function boot() {
  try {
    const get = async url => { const res = await fetch(url, { cache: "no-cache" }); if (!res.ok) throw new Error(url + " " + res.status); return res.json(); };
    COURSE = await get(COURSE_URL);
    const base = COURSE_URL.replace(/[^/]*$/, "");
    UNITS = await Promise.all(COURSE.units.map(u => get(base + u.file)));
    for (const u of UNITS) {
      u.words.forEach(w => { w.unit = u.id; WORDS.push(w); });
      BANK.push(...u.items);
      FINDABLE.push(...u.items, ...u.passage.questions, ...u.sentence.map(s => s.phone));
      SENTENCES.push(...u.sentence);
      Object.assign(GLOSS, u.glossary || {});
    }
    C = UNITS[0];
    for (const file of COURSE.assessments || []) {
      try {
        const F = await get(base + file);
        FORMS[F.form] = F;
        for (const l of F.vocab.levels) l.items.forEach(it => { AITEM[it.id] = { ...it, part: "vocab", level: l.id }; });
        F.vocab.parts.forEach(it => { AITEM[it.id] = { ...it, part: "parts", level: "parts" }; });
        for (const l of F.reading.levels) for (const p of l.passages) {
          APASS[p.id] = p;
          p.questions.forEach(q => { AITEM[q.id] = { ...q, part: "reading", level: l.id, passage: p.id }; });
        }
      } catch (e) { /* the course still works without the check */ }
    }
    ASSESS = FORMS.A || FORMS[formKeys()[0]] || null;
    if (COURSE.de) {
      try {
        DE = await get(base + COURSE.de);
        for (const T of DE.topics) (T.items || []).forEach(it => { AITEM[it.id] = { ...it, part: "de", level: T.id }; });
      } catch (e) { DE = null; }
    }
    if (COURSE.sweep) {
      try {
        SWEEP = await get(base + COURSE.sweep);
        for (const L of SWEEP.levels) L.items.forEach(it => { AITEM[it.id] = { ...it, part: "sweep", level: L.id }; });
      } catch (e) { SWEEP = null; }
    }
  } catch (e) {
    app.replaceChildren(topbar(), h("div", { class: "panel stack-s" }, h("h2", null, "Couldn't load the lessons"), h("p", { class: "muted" }, "The lesson files didn't load. Reload the page to try again.")));
    return;
  }
  store = await makeStore();
  window.addEventListener("unhandledrejection", e => { if (e.reason === "left") e.preventDefault(); });
  if (await handleJoin()) return;
  showProfiles();
}
boot();
})();
</script>
